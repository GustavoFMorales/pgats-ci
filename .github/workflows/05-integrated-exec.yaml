# CI de Nível 05 - Execução integrada

# nome da pipeline
name: 'Execução integrada'

# gatilhos / triggers - regras de disparos

# Gatilho manual = workflow_dispatch

on:
  workflow_dispatch:
  push:
    branches:
       - master

# tarefas dentro da pipeline

jobs:
  # nome do job
  inspecao:
    # máquina onde o job vai rodar
    runs-on: ubuntu-latest
    # passos do job
    steps:
      # precisamos fazer o clone do repositório para ter acesso ao código
      - uses: actions/checkout@v4

      # notificação de início no Discord
      - name: Notificar início no Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{"embeds":[{"title":"Pipeline Iniciada","description":"A execução integrada foi iniciada.","color":15770880}]}'

      # instalação do node
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # instalação do yarn
      - name: Instalando Yarn
        run: npm install -g yarn

      # instalação das dependências
      - name: Instalando Dependências
        run: yarn

      # inspeção de código
      - name: Inspeção de código
        run: yarn lint

      # notificação de sucesso no Discord (só executa se tudo passou)
      - name: Notificar sucesso no Discord
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: 'success'
          title: 'Inspeção Concluída com Sucesso'
          description: 'A inspeção de código passou.'
          color: 0x28A745

      # notificação de falha no Discord (só executa se algo falhou)
      - name: Notificar falha no Discord
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: 'failure'
          title: 'Inspeção Falhou'
          description: 'A inspeção de código falhou.'
          color: 0xDC3545

  unidade:
    runs-on: ubuntu-latest
    needs: [inspecao] # esse job só roda se o job de inspeção passar

    steps:
      - uses: actions/checkout@v4

      # notificação de início no Discord
      - name: Notificar início no Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{"embeds":[{"title":"Pipeline Iniciada","description":"A execução da unidade foi iniciada.","color":15770880}]}'

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Instalando Yarn
        run: npm install -g yarn

      - name: Instalando Dependências
        run: yarn

      - name: Executando testes unitários
        run: yarn run test
      # notificação de sucesso no Discord (só executa se tudo passou)
      - name: Notificar sucesso no Discord
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: 'success'
          title: 'Testes Unitários Concluídos com Sucesso'
          description: 'Todos os testes unitários passaram.'
          color: 0x28A745

      # notificação de falha no Discord (só executa se algo falhou)
      - name: Notificar falha no Discord
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: 'failure'
          title: 'Testes Unitários Falharam'
          description: 'Um ou mais testes unitários falharam.'
          color: 0xDC3545

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [inspecao] # esse job só roda se o job de inspeção passar

    steps:
      - uses: actions/checkout@v4

      # notificação de início no Discord
      - name: Notificar início no Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{"embeds":[{"title":"Pipeline Iniciada","description":"A execução dos testes e2e foi iniciada.","color":15770880}]}'

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Instalando Yarn
        run: npm install -g yarn

      - name: Instalando Dependências
        run: yarn

      # instalação dos browsers do Playwright
      - name: Instalando Browsers do Playwright
        run: yarn playwright install

      # executar os testes e2e
      - name: Executando testes e2e
        run: yarn run e2e

      # notificação de sucesso no Discord (só executa se tudo passou)
      - name: Notificar sucesso no Discord
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: 'success'
          title: 'Testes e2e Concluídos com Sucesso'
          description: 'Todos os testes e2e passaram.'
          color: 0x28A745

      # notificação de falha no Discord (só executa se algo falhou)
      - name: Notificar falha no Discord
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: 'failure'
          title: 'Testes e2e Falharam'
          description: 'Um ou mais testes e2e falharam.'
          color: 0xDC3545

      - name: Salvando relatórios de teste
        uses: actions/upload-artifact@v3
        if:  ${{always()}}
        with:
          path: ./playwright-report # caminho onde o Playwright salva os relatórios
          name: Relatório de Testes e2e # nome do artefato para facilitar
  deploy:
    runs-on: ubuntu-latest
    needs: [unidade, e2e-tests] # só roda se unidade e e2e passarem

    steps:
      - name: Simulando deploy
        run: echo "Deploy realizado com sucesso!"
