# CI de Nível 03 - Execução em runner self-hosted

# nome da pipeline
name: 'Execução Self-Hosted'

# gatilhos / triggers - regras de disparos

# Gatilho manual = workflow_dispatch

on:
  workflow_dispatch:

# tarefas dentro da pipeline

jobs:
  # nome do job
  e2e-tests:
    # máquina onde o job vai rodar
    runs-on: self-hosted # runner self-hosted configurado localmente
    # passos do job
    steps:
      # precisamos fazer o clone do repositório para ter acesso ao código
      - uses: actions/checkout@v4 # versão 4 da ação de checkout

      # instalação do node
      - uses: actions/setup-node@v4 # versão 4 da ação de setup-node
        with:
          node-version: 24.x # versão do node que queremos usar

      # instalação do yarn
      - name: Instalando Yarn
        run: npm install -g yarn # comando para instalar o yarn globalmente

      # instalação das dependências
      - name: Instalando Dependências
        run: yarn # comando para instalar as dependências do projeto

      # instalação dos browsers do Playwright
      - name: Instalando Browsers do Playwright
        run: yarn playwright install # comando para instalar os browsers necessários para o Playwright

      # executar os testes e2e
      - name: Executando testes e2e
        run: yarn run e2e # comando para rodar os testes e2e definidos
