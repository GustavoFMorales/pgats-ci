# CI de nível 01 - Disparo Manual através de clique

# nome da pipeline
name: 'Execução manual'

# gatilho / triggers - regras de disparo
# Gatilho manual = workflow_dispatch

on:
  workflow_dispatch:

#Tarefas dentro da pipeline

jobs:
  e2e-tests:
    #Precisamos definir a maquina onde o job vai rodar
    runs-on: ubuntu-latest #latest quer dizer a versão mais recente

    # passos do jobs
    steps:
      - uses: actions/checkout@v4

      # Notificação de início no Discord
      - name: Notificar início no Discord
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"▶️ Pipeline **${{ github.workflow }}** iniciada por **${{ github.actor }}**.\nCommit: \`${{ github.sha }}\`\"}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}

      #instalação do node
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      #instalação do yarn
      - name: instalado Yarn
        run: npm install -g yarn
      # Instalação das dependencias
      - name: Instalando  dependencias
        run: yarn
      # Instalando browser no playwritght
      - name: Instalando Browsers do PlayWritght
        run: yarn playwright install

      # Executar os testes e2e 
      - name: Executando testes e2e
        run: yarn run e2e

      # Notificação de sucesso no Discord
      - name: Notificar sucesso no Discord
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"✅ Pipeline **${{ github.workflow }}** finalizada com **sucesso**!\nCommit: \`${{ github.sha }}\`\"}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}

      # Notificação de falha no Discord
      - name: Notificar falha no Discord
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ Pipeline **${{ github.workflow }}** **falhou**!\nCommit: \`${{ github.sha }}\`\nVeja o log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}

