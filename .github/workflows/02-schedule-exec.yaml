# CI de Nível 02 - Disparo agendado via cron

# nome da pipeline
name: 'Execução Agendada'

# gatilhos / triggers - regras de disparos

# Gatilho agendado = schedule (cron)

on:
  schedule:
    - cron: '40 9 * * *' # Executa todos os dias às 09:40 (UTC) = 06:40 (Brasília)

# tarefas dentro da pipeline

jobs:
  # Precisamos definir a máquina onde o job vai rodar
  # nome do job
  e2e-tests:
    # máquina onde o job vai rodar
    runs-on: ubuntu-latest # latest quer dizer a versão mais recente
    # passos do job
    steps:
      # precisamos fazer o clone do repositório para ter acesso ao código
      - uses: actions/checkout@v4 # versão 4 da ação de checkout

      # notificação de início no Discord
      - name: Notificar início no Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{"embeds":[{"title":"Pipeline Iniciada","description":"A execução manual dos testes e2e foi iniciada.","color":15770880}]}'

      # instalação do node
      - uses: actions/setup-node@v4 # versão 4 da ação de setup-node
        with:
          node-version: 24.x # versão do node que queremos usar

      # instalação do yarn
      - name: Instalando Yarn
        run: npm install -g yarn # comando para instalar o yarn globalmente

      # instalação das dependências
      - name: Instalando Dependências
        run: yarn # comando para instalar as dependências do projeto

      # instalação dos browsers do Playwright
      - name: Instalando Browsers do Playwright
        run: yarn playwright install # comando para instalar os browsers necessários para o Playwright

      # executar os testes e2e
      - name: Executando testes e2e
        run: yarn run e2e # comando para rodar os testes e2e definidos

      # notificação de sucesso no Discord (só executa se tudo passou)
      - name: Notificar sucesso no Discord
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: "success"
          title: "Pipeline Concluída com Sucesso"
          description: "Todos os testes e2e passaram."
          color: 0x28A745

      # notificação de falha no Discord (só executa se algo falhou)
      - name: Notificar falha no Discord
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: "failure"
          title: "Pipeline Falhou"
          description: "Um ou mais testes e2e falharam."
          color: 0xDC3545